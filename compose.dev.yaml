# Optional source-only API hot reload. The normal compose.yaml runs image snapshots.
services:
  api:
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --reload, --no-access-log, --no-proxy-headers]
    volumes:
      - ./backend/app:/app/backend/app:ro
      - ./packages/spatial:/app/packages/spatial:ro
      - ./packages/iot-contract:/app/packages/iot-contract:ro
  worker:
    volumes:
      - ./backend/app:/app/backend/app:ro
      - ./packages/spatial:/app/packages/spatial:ro
      - ./packages/iot-contract:/app/packages/iot-contract:ro
