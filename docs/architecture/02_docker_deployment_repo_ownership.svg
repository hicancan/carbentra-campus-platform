<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2280" viewBox="0 0 3000 2280" role="img" aria-labelledby="title desc"><title id="title">02  Docker 云边部署与五仓库责任</title><desc id="desc">碳迹未来当前软件实现架构。工程交付版  ·  实物待验收。物理执行默认关闭，现场资质与投运另行核验。数据路径、控制路径、运行角色及仓库责任以不同区域表示。</desc><defs>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#008B80"/></marker>
