# Standalone file: never merge with development, production or transport overlays.
name: carbentra-public-demo-${CARBENTRA_PUBLIC_DEMO_ID:?Set a unique lowercase demo generation ID}
x-api-environment: &api-environment
  CARBENTRA_ENV: production
  CARBENTRA_DEPLOYMENT_MODE: public_simulation
  CARBENTRA_PUBLIC_DEMO_ID: ${CARBENTRA_PUBLIC_DEMO_ID:?Set a unique demo generation ID}
  CARBENTRA_PUBLIC_DEMO_LIFETIME_HOURS: ${CARBENTRA_PUBLIC_DEMO_LIFETIME_HOURS:-0}
  CARBENTRA_PUBLIC_DEMO_MAX_DATABASE_MB: ${CARBENTRA_PUBLIC_DEMO_MAX_DATABASE_MB:-4096}
  CARBENTRA_DATABASE_URL_FILE: /run/secrets/database_url
  CARBENTRA_ADMIN_USERNAME: ${CARBENTRA_ADMIN_USERNAME:-demo-administrator}
  CARBENTRA_PUBLIC_DEMO_VISITOR_USERNAME: ${CARBENTRA_PUBLIC_DEMO_VISITOR_USERNAME:-visitor}
  CARBENTRA_PUBLIC_DEMO_OPERATOR_USERNAME: ${CARBENTRA_PUBLIC_DEMO_OPERATOR_USERNAME:-simulation-operator}
  CARBENTRA_DEV_AUTH: 'false'
  CARBENTRA_AUTO_MIGRATE: 'false'
  CARBENTRA_SEED_DEMO: 'false'
  CARBENTRA_COOKIE_SECURE: 'true'
  CARBENTRA_SIMULATION_ENABLED: 'true'
  CARBENTRA_WORKER_ENABLED: 'false'
  CARBENTRA_PHYSICAL_DISPATCH_ENABLED: 'false'
  CARBENTRA_PHYSICAL_RELEASE_IDS: '[]'
  CARBENTRA_ADAPTER_ALLOWED_DEVICE_IDS: '[]'
  CARBENTRA_ENABLE_DOCS: 'false'
  CARBENTRA_SESSION_HOURS: '1'
  CARBENTRA_SIMULATION_BATCH_SIZE: '10'
  CARBENTRA_SIMULATION_INTERVAL_SECONDS: '60'
  CARBENTRA_CLASSROOM_SIMULATION_INTERVAL_SECONDS: '120'
  CARBENTRA_STALE_AFTER_SECONDS: '180'
  CARBENTRA_ANALYSIS_INTERVAL_SECONDS: '5'
  CARBENTRA_FORECAST_MAX_PENDING: '32'
  CARBENTRA_FORECAST_MAX_CACHED_RUNS: '512'
  CARBENTRA_ALLOWED_ORIGINS: '["https://${CARBENTRA_DEMO_HOST:?Set the approved HTTPS hostname}"]'
  CARBENTRA_TRUSTED_HOSTS: '["${CARBENTRA_DEMO_HOST:?Set the approved HTTPS hostname}","localhost","127.0.0.1","api"]'
  CARBENTRA_TRUSTED_PROXY_CIDRS: '["${CARBENTRA_DEMO_NETWORK_PREFIX:-172.30.88}.5/32"]'
x-backend: &backend
  image: carbentra-campus-api:${CARBENTRA_IMAGE_TAG:?Set the reviewed release tag}
  build: {context: ., dockerfile: backend/Dockerfile}
  environment: *api-environment
  secrets: [database_url]
  read_only: true
  tmpfs: ['/tmp:size=64m,noexec,nosuid']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [private]
  init: true
  pids_limit: 128
  cpus: 1.0
  mem_limit: 1g
  logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
services:
  db:
    platform: linux/amd64
    image: postgis/postgis:17-3.6-alpine@sha256:a8ffa9afeea4ad6eada171fa2afdb57cd3eb90f92ce20156aa2cb8411d70e0cd
    environment:
      POSTGRES_DB: carbentra_public_demo
      POSTGRES_USER: carbentra_demo_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      CARBENTRA_PUBLIC_DEMO_ID: ${CARBENTRA_PUBLIC_DEMO_ID:?Set a unique demo generation ID}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    command: [postgres, -c, max_connections=64, -c, shared_buffers=256MB, -c, work_mem=4MB, -c, max_wal_size=512MB, -c, log_statement=none]
    secrets: [postgres_password, database_password]
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/public-demo/postgres-init.sh:/docker-entrypoint-initdb.d/20-public-demo.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [private]
    restart: unless-stopped
    shm_size: 128mb
    pids_limit: 128
    cpus: 2.0
    mem_limit: 1g
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  migrate:
    <<: *backend
    command: [python, -m, app.public_demo, migrate]
    depends_on: {db: {condition: service_healthy}}
    restart: 'no'
  demo-init:
    <<: *backend
    command: [python, -m, app.public_demo, initialize, --confirm-isolated-demo, '${CARBENTRA_PUBLIC_DEMO_ID:?Set a unique demo generation ID}']
    environment:
      <<: *api-environment
      CARBENTRA_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      CARBENTRA_PUBLIC_DEMO_VISITOR_PASSWORD_FILE: /run/secrets/demo_visitor_password
      CARBENTRA_PUBLIC_DEMO_OPERATOR_PASSWORD_FILE: /run/secrets/demo_operator_password
    secrets: [database_url, admin_password, demo_visitor_password, demo_operator_password]
    depends_on: {migrate: {condition: service_completed_successfully}}
    mem_limit: 2g
    cpus: 2.0
    restart: 'no'
  api:
    <<: *backend
    command: [python, -m, app.public_demo, api]
    depends_on: {demo-init: {condition: service_completed_successfully}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: 'on-failure:3'
  worker:
    <<: *backend
    command: [python, -m, app.public_demo, worker]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -m, app.worker_health]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 60s
    restart: 'on-failure:3'
  analysis:
    <<: *backend
    command: [python, -m, app.public_demo, analysis]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -m, app.worker_health, --role, analysis]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 120s
    restart: 'on-failure:3'
  web:
    image: carbentra-campus-web:${CARBENTRA_IMAGE_TAG:?Set the reviewed release tag}
    build: {context: ., dockerfile: frontend/Dockerfile}
    # Keep the maintained web config, but cap workers even on a many-core host.
    entrypoint: [sh, -c, "sed 's/^worker_processes auto;/worker_processes 1;/;s|access_log /dev/stdout;|access_log off;|' /etc/nginx/nginx.conf > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'"]
    read_only: true
    tmpfs: ['/tmp:size=32m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health/web]
      interval: 10s
      timeout: 5s
      retries: 6
    pids_limit: 32
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  gateway:
    image: nginx:1.30.5-alpine3.24@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    user: '101:101'
    entrypoint: [sh, /etc/carbentra/public-demo/gateway-entrypoint.sh]
    environment:
      CARBENTRA_DEMO_HOST: ${CARBENTRA_DEMO_HOST:?Set the approved HTTPS hostname}
    ports:
      # Public binding is a deliberate operator change, after hosting approval.
      - '${CARBENTRA_DEMO_BIND_ADDRESS:-127.0.0.1}:80:8080'
      - '${CARBENTRA_DEMO_BIND_ADDRESS:-127.0.0.1}:443:8443'
    volumes:
      - ./infra/public-demo:/etc/carbentra/public-demo:ro
      - ${CARBENTRA_DEMO_TLS_DIR:?Set the external certificate directory}/fullchain.pem:/run/tls/fullchain.pem:ro
      - ${CARBENTRA_DEMO_TLS_DIR:?Set the external certificate directory}/privkey.pem:/run/tls/privkey.pem:ro
    read_only: true
    tmpfs: ['/tmp:size=32m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      private: {ipv4_address: '${CARBENTRA_DEMO_NETWORK_PREFIX:-172.30.88}.5'}
      ingress: {}
    depends_on: {web: {condition: service_healthy}}
    healthcheck:
      test: [CMD, nginx, -t, -c, /tmp/nginx.conf]
      interval: 15s
      timeout: 5s
      retries: 4
    pids_limit: 32
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
networks:
  private:
    internal: true
    ipam:
      config: [{subnet: '${CARBENTRA_DEMO_NETWORK_PREFIX:-172.30.88}.0/24'}]
  ingress: {driver: bridge}
volumes:
  database: {}
secrets:
  postgres_password: {file: '${CARBENTRA_SECRETS_DIR:?Set an external private secrets directory}/postgres_password'}
  database_password: {file: '${CARBENTRA_SECRETS_DIR:?Set an external private secrets directory}/database_password'}
  database_url: {file: '${CARBENTRA_SECRETS_DIR:?Set an external private secrets directory}/database_url'}
  admin_password: {file: '${CARBENTRA_SECRETS_DIR:?Set an external private secrets directory}/admin_password'}
  demo_visitor_password: {file: '${CARBENTRA_SECRETS_DIR:?Set an external private secrets directory}/demo_visitor_password'}
  demo_operator_password: {file: '${CARBENTRA_SECRETS_DIR:?Set an external private secrets directory}/demo_operator_password'}
