worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 2m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 ipv6=off valid=10s;
    server {
        listen 8443 ssl;
        server_name platform-tls;
        ssl_certificate /run/secrets/platform_server_certificate;
        ssl_certificate_key /run/secrets/platform_server_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /health/proxy { default_type text/plain; return 200 'ok\n'; }
        location /api/v1/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host api;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }
        location / { return 404; }
    }
}
