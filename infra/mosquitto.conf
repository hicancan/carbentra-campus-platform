# Optional explicitly enrolled mTLS transport. No plaintext listener.
listener 8883 0.0.0.0
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /tmp/mqtt-private/mqtt_ca
certfile /tmp/mqtt-private/mqtt_server_certificate
keyfile /tmp/mqtt-private/mqtt_server_key
acl_file /tmp/mqtt-private/mqtt_acl
tls_version tlsv1.2
persistence true
persistence_location /mosquitto/data/
pid_file /mosquitto/data/mosquitto.pid
autosave_interval 30
# Whole MQTT packet ceiling, including headers; reject before edge allocation.
max_packet_size 8192
max_queued_messages 1000
max_inflight_messages 20
retain_available false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
