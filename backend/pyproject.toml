[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carbentra-campus-api"
version = "0.1.0"
description = "Truthful campus-scale energy orchestration API with durable simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "SQLAlchemy==2.1.1",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.54.0",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "carbentra-iot-contract",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[tool.uv.sources]
carbentra-iot-contract = { workspace = true }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

